name: Fetch IRBANK IDs (Bulk from Master)

# 銘柄マスタ（master.csv）のうち内国株式を母集団に、指定した範囲（offset〜offset+limit）のIRBANK企業ID
# （EID）・URL・社名を一括取得する。20件処理するごとに自動でコミット・プッシュするため、途中で失敗しても
# それまでに取得できた分は失われない。
on:
  workflow_dispatch:
    inputs:
      offset:
        description: "銘柄マスタ（内国株式のみ）の何件目から処理するか（0始まり）"
        required: true
        default: "0"
      limit:
        description: "何件処理するか"
        required: true
        default: "200"

# stock/irbank.csv へ書き込むのはこのワークフローのみ（stock/pricesへ書き込む系とはファイルが別なので
# 排他制御グループも分ける）。同時に複数実行された場合の競合防止のため、それでも排他制御はしておく。
concurrency:
  group: stock-irbank-write
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340 # GitHub Actionsのジョブ上限（360分）に収まるよう余裕を持たせる
    steps:
      - name: コードリポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          path: code-repo

      - name: データリポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          repository: palmelo2nd/brain_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r code-repo/stock/scripts/requirements.txt

      - name: Git ユーザー設定
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 銘柄マスタからIRBANK企業IDを一括取得（20件のサブバッチごとにコミット）
        run: |
          OFFSET=${{ inputs.offset }}
          LIMIT=${{ inputs.limit }}
          SUB_BATCH=20
          END=$((OFFSET + LIMIT))

          for (( start=OFFSET; start<END; start+=SUB_BATCH )); do
            count=$SUB_BATCH
            remaining=$((END - start))
            if (( remaining < count )); then count=$remaining; fi

            echo "=== サブバッチ処理中: offset=$start limit=$count ==="

            # 1銘柄の失敗でスクリプトが非ゼロ終了しても、後続のコミット処理は必ず実行する
            python code-repo/stock/scripts/fetch_irbank_ids.py \
              --master "${{ github.workspace }}/data-repo/stock/master.csv" \
              --offset "$start" \
              --limit "$count" \
              --output-dir "${{ github.workspace }}/data-repo/stock" \
              || echo "一部の銘柄で取得に失敗しましたが、成功分のコミットは継続します"

            cd data-repo
            git add stock/irbank.csv
            if git diff --cached --quiet; then
              echo "変更なし（offset=$start〜$((start + count - 1))）"
            else
              git commit -m "chore: IRBANK企業ID取得（offset=${start}, count=${count}）"
              # 他のワークフロー実行と同時にpushして拒否された場合に備え、pull --rebaseしてから再試行する
              for i in 1 2 3 4 5; do
                if git push; then
                  break
                fi
                echo "pushに失敗しました。リモートの変更を取り込んで再試行します（${i}回目）"
                git pull --rebase origin main
              done
            fi
            cd ..
          done

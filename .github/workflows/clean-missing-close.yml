name: Clean Missing Close Rows

# 過去のfetch_prices.py（終値が空の行を除外していなかった旧版）で保存された空行を、
# stock/prices/配下の全CSVから一括除去する一回限りの修復用ワークフロー。
# GitHubのActionsタブから手動実行する（アプリ側にはボタンを用意していない）。
on:
  workflow_dispatch:

# stock/prices へ書き込む他のワークフローと同じグループ名にすることで、GitHub Actions自身に排他制御させる
concurrency:
  group: stock-prices-write
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: コードリポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          path: code-repo

      - name: データリポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          repository: palmelo2nd/brain_data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r code-repo/stock/scripts/requirements.txt

      - name: 終値が空の行を除去
        run: |
          python code-repo/stock/scripts/clean_missing_close.py \
            --dir "${{ github.workspace }}/data-repo/stock/prices"

      - name: Git ユーザー設定
        working-directory: data-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 変更をコミット・プッシュ
        working-directory: data-repo
        run: |
          git add stock/prices
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "chore: 終値が空の行を除去（過去のfetch_prices.py不具合の修復）"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "pushに失敗しました。リモートの変更を取り込んで再試行します（${i}回目）"
              git pull --rebase origin main
            done
          fi
